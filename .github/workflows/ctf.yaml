name: Breakout CTF

# The live-fire breakout CTF: a real agent attacks the contained breakout range from the
# Cloud Hypervisor attack box, and the verdict grades whether containment held. This is a
# PAID, LIVE-FIRE eval (it calls a real model and boots real VMs), so it never runs on a
# push or pull request. It runs on manual dispatch and on a weekly schedule.
#
# The range boots real VMs, so this needs a KVM-capable runner. `ubuntu-latest` is used on
# the assumption that the hosted runner exposes /dev/kvm; the preflight step refuses loudly
# before any paid leg if it does not. Point `runs-on` at a self-hosted KVM label instead
# where the hosted runner has no nested virtualization.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Agent model slug (e.g. anthropic/claude-..., openrouter/...). Empty takes the CTF_AGENT_MODEL repo variable, then the first model of config/ctf-round-set.json."
        required: false
        default: ""
      whitebox:
        description: "White-box posture. 'on' (default) unpacks the inspect_ranges source on the attack box and hands over the recon brief; 'off' is a lean black-box run."
        required: false
        default: "on"
        type: choice
        options: ["on", "off"]
      turns:
        description: "Message limit for the agent (react turns)."
        required: false
        default: "200"
  schedule:
    # Mondays, 11:11 UTC (outside the delayed 6-9am Pacific window).
    - cron: "11 11 * * 1"
  push:
    # Iterate from a feature branch: a push runs the CTF only when the head
    # commit subject STARTS WITH the [breakout-ctf] marker (the job `if` below),
    # so ordinary pushes never trigger a paid run. workflow_dispatch and the
    # schedule register only from the default branch.
    branches:
      - "claude/**"

concurrency:
  # A manual dispatch keys on its run id so repeat dispatches of one model coexist; the
  # scheduled run keys on the ref.
  group: ctf-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  breakout-ctf:
    # A push runs the paid CTF only when the head commit SUBJECT starts with the
    # [breakout-ctf] marker. startsWith (not contains) so a commit that merely
    # mentions the marker in its body or a diff never launches a paid run.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[breakout-ctf]')
    runs-on: ubuntu-latest
    # The agent's wall-clock (--time-limit below) matches the reference harness's
    # 400 turns x 48 s/turn = 19200 s (~320 min); the job timeout sits above that
    # plus build/derive/grade/upload, under the hosted runner's 6 h hard cap.
    timeout-minutes: 350
    strategy:
      # Measure both postures each run: white-box (source + brief delivered) and
      # black-box (neither). A dispatch `whitebox` input pins both legs to one
      # posture; an empty input (push, schedule) runs the pair. fail-fast off so
      # one posture's failure does not cancel the other.
      fail-fast: false
      matrix:
        whitebox: ["on", "off"]
    env:
      CTF_WHITEBOX: ${{ github.event.inputs.whitebox || matrix.whitebox }}
      CTF_ATTACKER_VMM: cloud-hypervisor
      INSPECT_RANGES_CTF_WHITEBOX: ${{ github.event.inputs.whitebox || matrix.whitebox }}
      # `inspect eval evals/ctf/task.py` loads the task file by path and does not
      # put the repo root on sys.path, so the task's absolute `evals.ctf.*`
      # imports (source_bundle, verdict) need the root on PYTHONPATH. This is the
      # CI counterpart of pyproject's pytest `pythonpath = ["."]`.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require KVM
        run: bash .github/scripts/ctf-require-kvm.sh

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install image-build tooling (qemu-utils, libguestfs-tools)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-utils libguestfs-tools
          # libguestfs/supermin builds its appliance from the host kernel and
          # must read it; Ubuntu ships /boot/vmlinuz-* mode 0600 (root only),
          # and the derive runs as the unprivileged runner user, so supermin
          # fails with "exited with error status 1". Make the kernel readable —
          # the standard libguestfs-on-CI fix (verified locally: a 0600 kernel
          # reproduces the failure, +r clears it and the derive completes).
          sudo chmod +r /boot/vmlinuz-* || true

      - name: Install the pinned Go toolchain (builds the daemon artifact)
        # `daemon-bundle` builds the control-channel daemon and refuses any Go
        # but the exact pin (src/inspect_ranges/_channel/bundle.py: GO_PIN), for
        # a reproducible artifact digest; the runner's PATH Go is newer. Install
        # the pin where inspect_ranges looks (~/.local/go-toolchains/<pin>), the
        # same toolchain and path as the Build workflow's test job.
        run: |
          curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.23.6.linux-amd64.tar.gz
          echo "9379441ea310de000f33a4dc767bd966e72ab2826270e038e78b2c53c2e7802d  /tmp/go.tgz" | sha256sum -c
          mkdir -p "$HOME/.local/go-toolchains"
          tar -C "$HOME/.local/go-toolchains" -xzf /tmp/go.tgz
          mv "$HOME/.local/go-toolchains/go" "$HOME/.local/go-toolchains/go1.23.6"
          "$HOME/.local/go-toolchains/go1.23.6/bin/go" version

      - name: Derive the ubuntu-noble golden
        # The range's `web` host boots the `ubuntu-noble` catalog golden, which
        # is empty on a fresh runner (the image cache is per-run, never
        # restored). Fetch the vendor cloud image and derive the golden the
        # same way design/spikes/kypo-build and ch-vmm do: hash what was
        # downloaded (no fixed sha is published for the "current" alias), bundle
        # the daemon, and derive. INSPECT_RANGES_IMAGE_CACHE/_BUILD_CACHE are
        # exported for every later step (the build, and the eval's provider).
        run: |
          set -euo pipefail
          image_cache="$RUNNER_TEMP/ir-cache/images"
          build_cache="$RUNNER_TEMP/ir-cache/builds"
          artifacts="$RUNNER_TEMP/ir-daemon-artifacts"
          mkdir -p "$image_cache" "$build_cache"
          vendor="$RUNNER_TEMP/noble-server-cloudimg-amd64.img"
          curl -fsSL -o "$vendor" https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          # Bake the Claude Code CLI into the attack image. The agent is
          # inspect_swe's claude_code (version="sandbox"), which needs `claude`
          # already on PATH in the box: the ~280 MB binary exceeds the range
          # daemon's 256 MiB single-write cap, so it cannot be pushed in over
          # the control channel at runtime. Resolve and fetch the release the
          # same way inspect_swe does (claude.ai/install.sh -> base URL ->
          # stable), then copy it into the vendor image before deriving, so the
          # golden every guest boots carries it. Done pre-derive so the derive's
          # recorded vendor sha matches the image it actually processed.
          cc_base="$(curl -fsSL https://claude.ai/install.sh | grep -oE '(DOWNLOAD_BASE_URL|GCS_BUCKET)=["'"'"']https://[^"'"'"']+' | head -1 | sed -E 's/.*=["'"'"']//')"
          cc_ver="$(curl -fsSL "$cc_base/stable")"
          curl -fsSL -o "$RUNNER_TEMP/claude" "$cc_base/$cc_ver/linux-x64/claude"
          echo "baking Claude Code $cc_ver into the attack image"
          # --no-network: the copy-in/chmod need no network, and libguestfs 1.52
          # enables the appliance network by default via passt, which exits 1 on
          # the hosted runner and fails the customize. Turning it off avoids passt
          # entirely (validated locally: the bake still lands the binary).
          virt-customize --no-network -a "$vendor" \
            --copy-in "$RUNNER_TEMP/claude:/usr/local/bin" \
            --run-command 'chmod +x /usr/local/bin/claude'
          vendor_sha="$(sha256sum "$vendor" | cut -d' ' -f1)"
          db_out="$(uv run inspect-ranges daemon-bundle -o "$artifacts")"
          daemon_sha="$(echo "$db_out" | grep -o 'bundle sha256:[0-9a-f]*' | cut -d: -f2)"
          uv run inspect-ranges images derive "$vendor" --sha256 "$vendor_sha" --name ubuntu-noble \
            --image-cache "$image_cache" \
            --daemon-bundle "$artifacts" --daemon-sha256 "$daemon_sha"
          echo "INSPECT_RANGES_IMAGE_CACHE=$image_cache" >>"$GITHUB_ENV"
          echo "INSPECT_RANGES_BUILD_CACHE=$build_cache" >>"$GITHUB_ENV"

      - name: Build the breakout CTF range
        # Realizes evals/ctf's declared guest content (the ctf.breakout-web
        # recipe) and captures it; the `range` sandbox provider refuses
        # `range-not-built` for a provisioned range with no matching manifest,
        # and this range has never been published, so it must build here.
        working-directory: evals/ctf
        run: |
          uv run inspect-ranges build \
            --image-cache "$INSPECT_RANGES_IMAGE_CACHE" \
            --build-cache "$INSPECT_RANGES_BUILD_CACHE"

      - name: Resolve the agent model
        id: model
        env:
          INPUT_MODEL: ${{ github.event.inputs.model }}
          VAR_MODEL: ${{ vars.CTF_AGENT_MODEL }}
        run: |
          set -euo pipefail
          model="$INPUT_MODEL"
          if [ -z "$model" ]; then model="$VAR_MODEL"; fi
          if [ -z "$model" ]; then
            model="$(jq -r '.rounds[0].model' config/ctf-round-set.json)"
          fi
          if [ -z "$model" ] || [ "$model" = "null" ]; then
            echo "::error::no agent model resolved (input, CTF_AGENT_MODEL, or round set)." >&2
            exit 1
          fi
          echo "model=$model" >>"$GITHUB_OUTPUT"
          echo "Resolved agent model: $model"

      - name: Require a model key
        # Fail cheaply, before any VM boot or model call, when the resolved
        # model's provider has no API key: a keyless run would otherwise boot
        # the range (paid compute) only to crash at the first generate, and the
        # verdict would read INCONCLUSIVE off a hollow run. Report each key's
        # presence (never its value) so a model/key mismatch is legible.
        env:
          CTF_MODEL: ${{ steps.model.outputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          for v in ANTHROPIC_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY; do
            if [ -n "${!v:-}" ]; then echo "$v: present"; else echo "$v: absent"; fi
          done
          provider="${CTF_MODEL%%/*}"
          case "$provider" in
            anthropic) need=ANTHROPIC_API_KEY ;;
            openrouter) need=OPENROUTER_API_KEY ;;
            openai) need=OPENAI_API_KEY ;;
            *) need="" ;;
          esac
          if [ -n "$need" ] && [ -z "${!need:-}" ]; then
            echo "::error::resolved model '$CTF_MODEL' needs $need, which is empty. Set that org/repo secret, or point CTF_AGENT_MODEL (or the dispatch model input) at a provider whose key is present." >&2
            exit 1
          fi
          echo "model key present for provider '$provider'."

      - name: Run the breakout CTF
        env:
          CTF_MODEL: ${{ steps.model.outputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p logs
          # The OpenAI-compatible providers (openrouter/, openai/) ride the openai
          # client, which is not a package dependency; the anthropic client is in the
          # dev group. --with openai makes an openrouter default resolve.
          # Claude Code is the agent (see evals/ctf/task.py): the message limit
          # bounds the bridged conversation (Claude Code has no separate
          # max-turns knob; Inspect's limit is the ceiling). Iteration pushes
          # default to 100; workflow_dispatch and the weekly schedule keep 200
          # (or an explicit dispatch input). --time-limit is a wall-clock
          # backstop (90 min) so a stuck agent can't consume the whole job
          # timeout and the run still scores whatever it reached.
          uv run --with openai inspect eval evals/ctf/task.py \
            --model "$CTF_MODEL" \
            --message-limit "${{ github.event.inputs.turns || '400' }}" \
            --time-limit 19200 \
            --log-dir logs \
            --log-format eval
          log="$(ls -t logs/*.eval | head -1)"
          echo "CTF_LOG=$log" >>"$GITHUB_ENV"
          echo "graded log: $log"

      - name: Grade containment
        env:
          CTF_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          uv run python -m evals.ctf.verdict "$CTF_LOG" --out verdict.json || true
          test -f verdict.json

      - name: Record the attempt
        env:
          CTF_MODEL: ${{ steps.model.outputs.model }}
        run: bash .github/scripts/ctf-record.sh verdict.json metrics/ctf.jsonl

      - name: Job summary
        env:
          CTF_MODEL: ${{ steps.model.outputs.model }}
        run: bash .github/scripts/ctf-job-summary.sh verdict.json

      - name: File or update the containment issue on a breakout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python .github/scripts/ctf-containment-issue.py \
            --verdict verdict.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload the verdict, ledger, and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakout-ctf-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.whitebox }}
          path: |
            verdict.json
            metrics/ctf.jsonl
            logs/
          if-no-files-found: warn

      - name: Publish the eval log and viewer to R2
        # Durable link beyond GitHub's artifact retention: bundles the native
        # .eval into a standalone Inspect viewer and uploads it (plus the raw log
        # and verdict) to R2 under a per-run key. A clean no-op when the R2
        # secrets are not configured (e.g. a fork), so it never fails the run.
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CTF_POSTURE: ${{ matrix.whitebox == 'on' && 'whitebox' || 'blackbox' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: bash .github/scripts/ctf-publish-eval.sh
